name: Node w/ TS CI Pipeline

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install
      run: rm -rf node_modules && bun install --frozen-lockfile

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'

    - name: Lint
      run: npm run lint:ci
      
    - name: Test
      run: npm run test
